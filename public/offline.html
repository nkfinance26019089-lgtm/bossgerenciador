<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0a08" />
    <title>Sem conexão · BSS Painel</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #100e0b;
        color: #f2ebdd;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        min-height: 100vh;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 32px 24px;
        text-align: center;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 20px;
      }
      h1 {
        margin: 0;
        font-family: Georgia, serif;
        font-size: 26px;
      }
      p {
        margin: 0;
        max-width: 320px;
        color: #a99f8f;
        line-height: 1.5;
      }
      button {
        min-height: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 12px;
        background: #d4a24c;
        color: #1a1209;
        font-size: 16px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icone-192.png" alt="BSS Eventos" />
      <h1>Sem conexão</h1>
      <p>O painel precisa de internet para mostrar os gastos atualizados. Confira o Wi-Fi ou os dados móveis e tente de novo.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
